<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in — Iroko Lifesciences Advisory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}">
</head>
<body>
  <div class="page login-page">
    <header class="brand-header login-header">
      <div class="monogram">IL</div>
      <div class="wordmark">Iroko Lifesciences Advisory
        <small>Content dashboard</small>
      </div>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="notice {{ 'notice-error' if category == 'error' }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <div class="card">
      <div class="card-body">
        <div class="eyebrow">Sign in</div>
        <h1>Welcome back, Dr.&nbsp;Ike</h1>
        <p class="meta">Enter your password to review today's post options.</p>
        <form method="post" action="{{ url_for('login_submit') }}">
          <input type="text" name="username" value="ike" autocomplete="username" hidden aria-hidden="true">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autofocus autocomplete="current-password">
          <div class="actions">
            <button class="btn btn-primary">Sign in</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
